name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests don't load transformer models, so torch/transformers are not needed here.
      - run: pip install "scikit-learn==1.9.1" joblib pandas numpy requests pillow pytest pyarrow
      - run: pytest -q
